[project]
name = "funcap-solver"
version = "0.1.0"
description = "AI pipeline for solving FunCAPTCHA using fine-tuning and classification"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "transformers>=4.30",
    "datasets>=2.12",
    "pillow>=9.5",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "tqdm>=4.65",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "accelerate>=0.21",
    "peft>=0.5",
    "wandb>=0.15",
    "albumentations>=1.3",
    "pandas>=2.0",
    "requests>=2.31",
    "selenium>=4.15",
    "playwright>=1.40",
]

[project.optional-dependencies]
colab = [
    "google-colab>=1.0",
    "gdown>=4.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
